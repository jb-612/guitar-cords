name: Desktop apps

# Push a tag like v0.2.0 to build macOS, Windows and Linux apps, smoke-test each
# packaged app (plays a song, renders tab), and attach them to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke-test the packaged app
        if: runner.os != 'Linux'
        run: npm run selftest:packaged
      - name: Smoke-test the packaged app (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run selftest:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: guitar-cords-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
